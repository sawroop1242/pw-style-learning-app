name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "True"
      SECRET_KEY: "test-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for uncommitted model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test

      - name: Compile Python modules
        run: python -m compileall -q config courses
