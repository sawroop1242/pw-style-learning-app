name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "True"
      SECRET_KEY: "test-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (pinned, hashes verified)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Django system check
        run: python manage.py check

      - name: Check for uncommitted model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test

      - name: Compile Python modules
        run: python -m compileall -q config courses

  # SQLite and PostgreSQL do not behave the same under concurrency, and this
  # application depends on the difference: `select_for_update()` is what stops
  # two submissions scoring one attempt twice and two redemptions using one
  # access code. The job above runs on SQLite because it is fast; this one runs
  # the same suite against the database production actually uses.
  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "True"
      SECRET_KEY: "test-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "postgres://studyspace:studyspace@127.0.0.1:5432/studyspace"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyspace
          POSTGRES_PASSWORD: studyspace
          POSTGRES_DB: studyspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies (pinned, hashes verified)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Migrations apply to a real PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run Django tests
        run: python manage.py test

  # `requirements.txt` states ranges a human is allowed to edit; `requirements.lock`
  # is what gets installed. This job fails when the two disagree, so a dependency
  # bump cannot land without its pins.
  lock:
    name: Dependency lock is current
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The lock is generated on the lowest version we support, so every pin
          # has a wheel there; hashes then hold for any newer interpreter.
          python-version: "3.11"

      - name: Recompile the lock and compare
        run: |
          python -m pip install --quiet "pip-tools==7.6.2"
          pip-compile --generate-hashes --strip-extras --quiet \
            --output-file requirements.lock.check requirements.txt
          # The header names the output file, so it is not part of the contract.
          diff -u <(sed '1,6d' requirements.lock) <(sed '1,6d' requirements.lock.check)
          rm requirements.lock.check
