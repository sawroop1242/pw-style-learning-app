# Vercel resolves a Django project by running manage.py and then importing the
# module named in WSGI_APPLICATION / ASGI_APPLICATION. Those paths are relative
# to the repository root, and this project's Django package lives in backend/,
# so they cannot be imported from there.
#
# `tool.vercel.entrypoint` overrides that guesswork and names the module Vercel
# should load instead. wsgi.py at the repository root adds backend/ to
# sys.path, sets DJANGO_SETTINGS_MODULE and exports `application`/`app`, so the
# function starts the same application gunicorn does locally.
[tool.vercel]
entrypoint = "wsgi.py"
