<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b16">
  <meta name="api-base" content="/api">
  <title>Announcements | StudySpace</title>
  <meta name="description" content="Batch announcements and student discussion in one place.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/screens.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <div class="player-shell">
        <div class="player-top">
          <a class="icon-btn" href="index.html" aria-label="Back to home"><svg><use href="#i-arrow-left"/></svg></a>
          <h1>Announcements</h1>
          <a class="icon-btn" href="legal.html#contact" aria-label="Community guidelines"><svg><use href="#i-info"/></svg></a>
        </div>

        <div class="tabs" role="tablist" aria-label="Announcement scope">
          <button class="tab" role="tab" aria-selected="true" aria-controls="panel-all" id="tab-all">All</button>
          <button class="tab" role="tab" aria-selected="false" aria-controls="panel-batch" id="tab-batch">My batches</button>
        </div>

        <section class="tab-panel" id="panel-all" role="tabpanel" aria-labelledby="tab-all">
          <div class="post-list" id="announcement-list"></div>
        </section>
        <section class="tab-panel" id="panel-batch" role="tabpanel" aria-labelledby="tab-batch" hidden>
          <div class="post-list" id="batch-list"></div>
        </section>
      </div>
    </div>
  </main>
  <div id="site-tabbar"></div>
  <script type="module" src="assets/js/community.js"></script>
</body>
</html>
