<!doctype html>
<html lang="en-IN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class — StudySpace</title>
  <meta name="description" content="Watch a recorded class, read the notes for its section and follow the batch announcements.">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <div class="player-shell">
        <div class="player-top">
          <a class="icon-btn" href="courses.html" aria-label="Back to batches"><svg><use href="#i-arrow-left"/></svg></a>
          <h1>Class</h1>
          <a class="icon-btn" href="downloads.html" aria-label="Notes and downloads"><svg><use href="#i-download"/></svg></a>
        </div>

        <div class="player-stage" id="player-stage" role="group" aria-label="Class video">
          <span class="stage-face" aria-hidden="true" id="stage-face">SS</span>
          <div class="stage-empty" id="stage-empty" hidden>
            <strong>No recording published</strong>
            <p>This class has no video URL yet. The description and the section notes are still available.</p>
          </div>
          <video id="player-video" class="player-video" controls hidden playsinline preload="metadata"></video>
        </div>

        <div class="player-meta">
          <div>
            <h2 id="player-title">Loading class…</h2>
            <p id="player-sub"></p>
          </div>
          <a class="icon-btn" href="downloads.html" aria-label="Open downloads"><svg><use href="#i-download"/></svg></a>
        </div>

        <p class="player-brief" id="player-brief"></p>

        <div class="tabs" role="tablist" aria-label="Class sections">
          <button class="tab" role="tab" aria-selected="true" aria-controls="panel-chapters" id="tab-chapters">Section lessons</button>
          <button class="tab" role="tab" aria-selected="false" aria-controls="panel-notes" id="tab-notes">Notes</button>
          <button class="tab" role="tab" aria-selected="false" aria-controls="panel-notices" id="tab-notices">Announcements</button>
        </div>

        <section class="tab-panel" id="panel-chapters" role="tabpanel" aria-labelledby="tab-chapters">
          <div class="lesson-list" id="chapter-list"></div>
        </section>
        <section class="tab-panel" id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" hidden>
          <div id="note-list"></div>
        </section>
        <section class="tab-panel" id="panel-notices" role="tabpanel" aria-labelledby="tab-notices" hidden>
          <div id="notice-list"></div>
        </section>

        <div class="player-nav">
          <a class="btn btn-ghost" href="#" id="prev-link" hidden><svg><use href="#i-chevron-left"/></svg> Prev lesson</a>
          <a class="btn btn-primary" href="#" id="next-link" hidden>Next lesson <svg><use href="#i-chevron-right"/></svg></a>
        </div>
      </div>
    </div>
  </main>
  <div id="site-tabbar"></div>
  <script type="module" src="assets/js/player.js"></script>
</body>
</html>
