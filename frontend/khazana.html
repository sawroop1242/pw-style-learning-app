<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b16">
  <meta name="api-base" content="/api">
  <title>Khazana — free chapters and lectures | StudySpace</title>
  <meta name="description" content="Browse free chapters, lectures and practice material by subject. Physics, Reasoning, Polity, Geography, Economics and more.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/screens.css">
</head>
<body>
  <noscript>
    <div class="noscript-bar" role="note">
      StudySpace needs JavaScript for the library.
      Please enable it, or write to
      <a href="mailto:support@studyspace.example">support@studyspace.example</a> for help.
    </div>
  </noscript>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <section class="welcome">
        <div>
          <h1>Khazana</h1>
          <p>Free chapters and lectures, sorted by subject. No access code needed.</p>
        </div>
        <a class="welcome-avatar" href="profile.html" aria-label="Open your profile" data-welcome-avatar>ST</a>
      </section>

      <section class="section-tight">
        <div class="section-head">
          <div>
            <p class="eyebrow">The library</p>
            <h2 class="section-title">Subjects</h2>
          </div>
          <p class="tiny subtle" id="khazana-count">Loading…</p>
        </div>
        <div class="khazana-grid" id="subject-grid" aria-live="polite"></div>
      </section>

      <section class="section-tight">
        <div class="section-head">
          <div>
            <p class="eyebrow">Recently added</p>
            <h2 class="section-title">Free batches in the library</h2>
          </div>
          <a class="link" href="courses.html?price=free">All free batches <svg><use href="#i-arrow-right"/></svg></a>
        </div>
        <div class="batch-grid" id="free-grid" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-tabbar"></div>
  <script type="module" src="assets/js/khazana.js"></script>
</body>
</html>
