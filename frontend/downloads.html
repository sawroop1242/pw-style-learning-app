<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b16">
  <meta name="api-base" content="/api">
  <title>Downloads | StudySpace</title>
  <meta name="description" content="Lectures, notes and tests saved for offline study.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/screens.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <div class="player-shell">
        <div class="player-top">
          <a class="icon-btn" href="dashboard.html" aria-label="Back to my learning"><svg><use href="#i-arrow-left"/></svg></a>
          <h1>Downloads</h1>
          <a class="icon-btn" href="profile.html" aria-label="Profile"><svg><use href="#i-user"/></svg></a>
        </div>

        <div class="tabs" role="tablist" aria-label="Download types">
          <button class="tab" role="tab" aria-selected="true" aria-controls="panel-lectures" id="tab-lectures">Lectures</button>
          <button class="tab" role="tab" aria-selected="false" aria-controls="panel-dln" id="tab-dln">Notes</button>
          <button class="tab" role="tab" aria-selected="false" aria-controls="panel-dlt" id="tab-dlt">Tests</button>
        </div>

        <section class="tab-panel" id="panel-lectures" role="tabpanel" aria-labelledby="tab-lectures">
          <div id="list-lectures"></div>
        </section>
        <section class="tab-panel" id="panel-dln" role="tabpanel" aria-labelledby="tab-dln" hidden>
          <div id="list-notes"></div>
        </section>
        <section class="tab-panel" id="panel-dlt" role="tabpanel" aria-labelledby="tab-dlt" hidden>
          <div id="list-tests"></div>
        </section>

        <p class="tiny subtle" style="margin-top:24px">
          Saved items stay readable offline once opened. Tests open the exam window and are always
          scored on the server, so a saved test needs a connection to submit.
        </p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-tabbar"></div>
  <script type="module" src="assets/js/downloads.js"></script>
</body>
</html>
