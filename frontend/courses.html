<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b16">
  <meta name="api-base" content="/api">
  <title>All batches — StudySpace</title>
  <meta name="description" content="Browse live and recorded batches for JEE, NEET, UPSC, SSC, GATE and school boards. Filter by exam, subject, language and price.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/screens.css">
</head>
<body>
  <noscript>
    <div class="noscript-bar" role="note">
      StudySpace needs JavaScript for the catalogue, tests and dashboard.
      Please enable it, or write to
      <a href="mailto:support@studyspace.example">support@studyspace.example</a> for help.
    </div>
  </noscript>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <section class="welcome">
        <div>
          <h1>Batches</h1>
          <p>Live classes with recorded backups, notes and a test after every unit.</p>
        </div>
        <a class="welcome-avatar" href="profile.html" aria-label="Open your profile" data-welcome-avatar>ST</a>
      </section>

      <section class="section-tight">
        <div class="tabs" role="tablist" aria-label="Batch lists">
          <button class="tab" role="tab" aria-selected="true" aria-controls="panel-all" id="tab-all">All Batches</button>
          <button class="tab" role="tab" aria-selected="false" aria-controls="panel-mine" id="tab-mine">My Batches</button>
          <button class="tab" role="tab" aria-selected="false" aria-controls="panel-fav" id="tab-fav">Favorite Batches</button>
        </div>

        <section class="tab-panel" id="panel-all" role="tabpanel" aria-labelledby="tab-all">
          <div class="catalog-toolbar">
            <p class="result-count" id="result-count">Loading batches…</p>
            <div class="toolbar-actions">
              <button class="btn btn-ghost btn-sm mobile-filter-btn" id="open-filters">
                <svg><use href="#i-filter"/></svg> Filters
              </button>
              <label class="visually-hidden" for="sort-select">Sort by</label>
              <select class="select" id="sort-select" style="min-height:38px;font-size:13px;padding-block:6px;width:auto">
                <option value="popular">Most popular</option>
                <option value="newest">Newest first</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="rating">Highest rated</option>
              </select>
            </div>
          </div>

          <div class="row wrap" id="active-filters" style="margin-bottom:16px"></div>

          <div class="catalog-layout">
            <aside class="filter-panel" id="filter-panel" aria-label="Filters">
              <div class="filter-group">
                <h2>Exam</h2>
                <div class="filter-list" id="filter-exam"></div>
              </div>
              <div class="filter-group">
                <h2>Subject</h2>
                <div class="filter-list" id="filter-subject"></div>
              </div>
              <div class="filter-group">
                <h2>Price</h2>
                <div class="filter-list" id="filter-price">
                  <label><span>All batches</span><input type="radio" name="price" value="all" checked></label>
                  <label><span>Free only</span><input type="radio" name="price" value="free"></label>
                  <label><span>Paid</span><input type="radio" name="price" value="paid"></label>
                </div>
              </div>
              <div class="filter-group">
                <h2>Language</h2>
                <div class="filter-list" id="filter-language"></div>
              </div>
              <button class="btn btn-ghost btn-block btn-sm" id="clear-filters">Clear all filters</button>
            </aside>

            <div>
              <div class="batch-grid" id="course-grid" aria-live="polite"></div>
              <div id="results-empty" hidden></div>
              <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="panel-mine" role="tabpanel" aria-labelledby="tab-mine" hidden>
          <div class="batch-grid" id="my-grid" aria-live="polite"></div>
        </section>

        <section class="tab-panel" id="panel-fav" role="tabpanel" aria-labelledby="tab-fav" hidden>
          <div id="fav-empty"></div>
        </section>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-tabbar"></div>

  <script type="module" src="assets/js/courses.js"></script>
</body>
</html>
